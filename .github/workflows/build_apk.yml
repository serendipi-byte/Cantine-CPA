name: Générer l'APK Flutter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Sauvegarde du code main.dart
        run: cp lib/main.dart main_backup.dart

      - name: Initialisation de la structure Android
        run: |
          flutter create . --project-name cantine_cpa --platforms=android --org=com.cpa.cantine --overwrite

      - name: Restauration du code main.dart
        run: cp main_backup.dart lib/main.dart

      - name: Installation des dépendances
        run: flutter pub get

      - name: Compilation de l'APK Android
        run: flutter build apk --release --no-tree-shake-icons

      - name: Sauvegarder l'APK pour téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: cantine-cpa-app
          path: build/app/outputs/flutter-apk/app-release.apk
